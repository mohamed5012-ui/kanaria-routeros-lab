name: cards-lab
on:
  push:
    branches: [main]
    paths: ['cards/**', 'cards2/**', 'cards3/**', '.github/workflows/cards-lab.yml']
  workflow_dispatch:
    inputs:
      job:
        description: 'cards or images'
        default: 'cards'
permissions:
  contents: write
jobs:
  cards:
    if: github.event_name == 'push' || inputs.job == 'cards'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        ros: ['6.47.9', '6.49.19', '7.24.5']
    steps:
      - uses: actions/checkout@v4
      - name: Tools and KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-x86 sshpass unzip > /dev/null
          pip install -q pexpect
      - name: RouterOS image
        run: |
          v=${{ matrix.ros }}
          for i in 1 2 3 4 5; do
            for u in https://download.mikrotik.com/routeros/$v/chr-$v.img.zip https://cdn.mikrotik.com/routeros/$v/chr-$v.img.zip; do
              rm -f chr.zip; curl -fSL --retry 3 --retry-delay 5 -o chr.zip "$u" && unzip -tq chr.zip && break 2; echo "download failed: $u"
            done; sleep 15
          done
          unzip -o chr.zip && mv chr-*.img chr.img && ls -la chr.img
      - name: Cards on the router
        run: |
          O="$RUNNER_TEMP/out"; mkdir -p "$O"; cd "$O"
          openssl req -x509 -newkey rsa:2048 -nodes -keyout ca.key -out ca.crt -days 2 -subj "/CN=Kanaria Lab CA" -addext "basicConstraints=critical,CA:TRUE" -addext "keyUsage=critical,keyCertSign,cRLSign"
          openssl req -newkey rsa:2048 -nodes -keyout srv.key -out srv.csr -subj "/CN=10.0.2.2"
          printf "subjectAltName=IP:10.0.2.2\nbasicConstraints=CA:FALSE\nkeyUsage=digitalSignature,keyEncipherment\nextendedKeyUsage=serverAuth\n" > ext.cnf
          openssl x509 -req -in srv.csr -CA ca.crt -CAkey ca.key -CAcreateserial -out srv.crt -days 2 -extfile ext.cnf
          cat srv.crt ca.crt > chain.crt
          nohup python3 "$GITHUB_WORKSPACE/cards/recvd.py" chain.crt srv.key "$O/recv.log" > "$O/recvd.out" 2>&1 &
          sleep 1; cd "$GITHUB_WORKSPACE"
          timeout 1300 python3 cards/cardslab.py chr.img ros-${{ matrix.ros }} "$O"; echo "::notice title=cards exit::$?"
      - name: Cards 2 (V2.11.58 router-side logic)
        run: |
          O="$RUNNER_TEMP/out"; mkdir -p "$O/c2"; cp "$O/ca.crt" "$O/c2/"
          cd "$GITHUB_WORKSPACE"
          LAB_RECV="$O/recv.log" timeout 1300 python3 cards2/cards2lab.py chr.img ros-${{ matrix.ros }} "$O/c2"; echo "::notice title=cards2 exit::$?"
      - name: Cards 3 (the panel's own scripts)
        run: |
          O="$RUNNER_TEMP/out"; mkdir -p "$O/c3"; cp "$O/ca.crt" "$O/c3/"
          cd "$GITHUB_WORKSPACE"
          LAB_RECV="$O/recv.log" timeout 1300 python3 cards3/cards3lab.py chr.img ros-${{ matrix.ros }} "$O/c3"; echo "::notice title=cards3 exit::$?"
      - name: Keep the result in a branch
        if: always()
        run: |
          b=cards-result-${{ matrix.ros }}
          cp "$RUNNER_TEMP/out/cards-result.json" /tmp/r.json || echo '{}' > /tmp/r.json
          cp "$RUNNER_TEMP/out/c2/cards-result.json" /tmp/r2.json || echo '{}' > /tmp/r2.json
          cp "$RUNNER_TEMP/out/c3/cards-result.json" /tmp/r3.json || echo '{}' > /tmp/r3.json
          git config user.name lab; git config user.email lab@example.invalid
          git checkout --orphan "$b"; git rm -rfq . ; cp /tmp/r.json cards-result.json; cp /tmp/r2.json cards2-result.json; cp /tmp/r3.json cards3-result.json; git add cards-result.json cards2-result.json cards3-result.json
          git commit -qm "cards lab ${{ matrix.ros }}"; git push -qf origin "$b"
  images:
    if: inputs.job == 'images'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        ros: ['6.49.19', '7.16.2', '7.24.5']
    steps:
      - name: RouterOS image
        run: |
          v=${{ matrix.ros }}
          for i in 1 2 3 4 5; do
            for u in https://download.mikrotik.com/routeros/$v/chr-$v.img.zip https://cdn.mikrotik.com/routeros/$v/chr-$v.img.zip; do
              rm -f chr.zip; curl -fSL --retry 3 --retry-delay 5 -o chr.zip "$u" && unzip -tq chr.zip && break 2; echo "download failed: $u"
            done; sleep 15
          done
          mkdir img && mv chr.zip img/chr-$v.img.zip && sha256sum img/*
      - uses: actions/upload-artifact@v4
        with:
          name: chr-${{ matrix.ros }}
          path: img/
          retention-days: 3
